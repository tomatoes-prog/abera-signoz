name: goci

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMEMLIMIT: 3GiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.7'
      # Run directly: upstream Primus requires SigNoz's private GitHub app.
      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -t unformatted < <(gofmt -l pkg cmd/community cmd/abera-gateway abera/tools/namespace-go)
          if [ "${#unformatted[@]}" -ne 0 ]; then
            printf '%s\n' "${unformatted[@]}"
            exit 1
          fi
      - name: Check Community dependency graph
        shell: bash
        run: |
          go list -deps ./cmd/community > /tmp/community-dependencies.txt
          if grep -E '^github.com/SigNoz/signoz/(ee|cmd/enterprise)(/|$)' /tmp/community-dependencies.txt; then
            exit 1
          fi
      - name: Community unit tests and vet
        run: go test -p 2 ./pkg/... ./cmd/community/... ./cmd/abera-gateway/... ./abera/tools/namespace-go
      - name: Check generated semantic conventions
        run: make semconv-check
      - name: Build Community and gateway
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -p 2 -trimpath -tags timetzdata -o dist/signoz ./cmd/community
          go build -p 2 -trimpath -o dist/abera-gateway ./cmd/abera-gateway
