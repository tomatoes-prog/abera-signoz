name: Abera DEV validation

on:
  pull_request:
    paths:
      - 'abera/**'
      - 'pkg/abera/**'
      - 'cmd/abera-gateway/**'
      - '.github/workflows/abera-dev.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r abera/docker/controller-requirements.txt pytest==8.4.2
      - run: python -m pytest abera/tests -q
      - run: go test ./pkg/abera/... ./abera/tools/namespace-go
      - name: Check namespace patch remains idempotent
        run: |
          go run ./abera/tools/namespace-go --root .
          git diff --exit-code -- '*.go'
