name: jsci

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      COREPACK_ENABLE_AUTO_PIN: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      # Match the public toolchain used by the Community Dockerfile.
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm exec tsgo --noEmit
      - name: Check formatting
        run: pnpm fmt
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test --ci --runInBand
      - name: Plugin tests
        run: pnpm test:plugins
      - name: Build frontend
        run: pnpm build
